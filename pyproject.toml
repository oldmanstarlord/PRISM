[project]
name = "prism-market-intelligence"
version = "0.1.0"
description = "Portfolio Risk & Intelligence System for Markets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16",
  "apscheduler>=3.11",
  "arch>=7.2",
  "fastapi>=0.116",
  "httpx>=0.28",
  "networkx>=3.4",
  "numpy>=2.2",
  "orjson>=3.10",
  "pandas>=2.2",
  "pyarrow>=25.0",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "scikit-learn>=1.6",
  "scipy>=1.15",
  "sqlalchemy>=2.0",
  "statsmodels>=0.14",
  "structlog>=25.4",
  "tenacity>=9.1",
  "uvicorn[standard]>=0.35",
  "yfinance>=0.2.65",
]

[project.optional-dependencies]
ml = [
  "torch>=2.7",
  "torch-geometric>=2.6",
  "transformers>=4.53",
  "xgboost>=3.0",
]

[dependency-groups]
dev = [
  "mypy>=1.16",
  "pre-commit>=4.2",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# Layer 1 and Layer 2 files are approved and must not be edited.
# Their `# type: ignore[import-untyped]` comments were written before pandas/numpy
# shipped inline stubs; suppressing warn_unused_ignores for these modules only.
[[tool.mypy.overrides]]
module = [
  "backend.app.sector_divergence.inputs",
  "backend.app.sector_divergence.calculator",
  "backend.app.correlation_mst.inputs",
]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
  "pandas.*",
  "pandas",
  "yfinance.*",
  "yfinance",
  "sklearn.*",
  "statsmodels.*",
  "scipy.*",
  "scipy",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "jobs"]
