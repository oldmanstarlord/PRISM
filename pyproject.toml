[project]
name = "prism-market-intelligence"
version = "0.1.0"
description = "Portfolio Risk & Intelligence System for Markets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16",
  "apscheduler>=3.11",
  "arch>=7.2",
  "catboost>=1.2.8,<1.3",
  "fastapi>=0.116",
  "httpx>=0.28",
  "joblib>=1.4",
  "lxml>=5.3",
  "networkx>=3.4",
  "numpy>=2.2",
  "orjson>=3.10",
  "pandas>=2.2",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "scikit-learn>=1.6",
  "scipy>=1.15",
  "sqlalchemy>=2.0",
  "statsmodels>=0.14",
  "structlog>=25.4",
  "tenacity>=9.1",
  "torch==2.14.0",
  "torch-geometric>=2.6",
  "transformers>=4.53",
  "uvicorn[standard]>=0.35",
  "xgboost>=3.0",
  "yfinance>=0.2.65",
]

[dependency-groups]
dev = [
  "mypy>=1.16",
  "pre-commit>=4.2",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "integration: requires an explicitly configured PostgreSQL test database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "lxml.*", "catboost.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "jobs"]

# Render and the portable container run CPU inference; avoid shipping CUDA runtimes.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
