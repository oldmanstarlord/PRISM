[project]
name = "prism-market-intelligence"
version = "0.1.0"
description = "Portfolio Risk & Intelligence System for Markets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16",
  "fastapi>=0.116",
  "httpx>=0.28",
  "joblib>=1.4",
  "numpy>=2.2",
  "pandas>=2.2",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "scikit-learn>=1.6",
  "scipy>=1.15",
  "sqlalchemy>=2.0",
  "statsmodels>=0.14",
  "tenacity>=9.1",
  "torch>=2.7",
  "transformers>=4.53",
  "uvicorn[standard]>=0.35",
  "yfinance>=0.2.65",
]

[dependency-groups]
dev = [
  "mypy>=1.16",
  "pre-commit>=4.2",
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --basetemp=.pytest_tmp"
markers = [
  "integration: requires an explicitly configured PostgreSQL test database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "jobs"]
